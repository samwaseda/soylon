[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soylon"
version = "0.1.0"
description = "A thin layer between Matrix and a callback function"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp-socks>=0.10",
    "flowrep==0.6.6",
    "matplotlib==3.11.2",
    "matrix-nio>=0.26.0",
    "numpy==2.5.3",
    "python-dotenv==1.2.4",
    "python-socks>=2.7",
    "scikit-image==0.26.0",
]

[tool.setuptools.packages.find]
include = ["soylon*"]
